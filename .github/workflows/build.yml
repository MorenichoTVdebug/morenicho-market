name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "principal" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Find and extract zip if present
      run: |
        if [ -f "morenicho-market.zip" ]; then
          unzip -q morenicho-market.zip -d temp_extracted
          if [ -d "temp_extracted/app" ]; then
            cp -r temp_extracted/* .
          else
            SUBDIR=$(ls temp_extracted | head -n 1)
            cp -r temp_extracted/$SUBDIR/* .
          fi
        fi
        ls -la
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk


